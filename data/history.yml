items:
    - year: "2004"
      title: 朝之雾动漫社成立
      text: 故事的第一章，从一群喜欢动画、漫画与游戏的人开始。早期社团资料正在整理中。
      image: ""
    - year: "2019"
      title: 一届又一届，接过热爱
      text: 旧档案留存了这一年的换届活动配图。面孔更替，属于朝之雾的故事继续书写。活动细节待现任干部核对。
      image: /uploads/legacy/handover-2019.jpg
    - year: "2021"
      title: 银幕内外的共同记忆
      text: 放映、外拍与同好相聚，留下了这一年的社团日常。图片来自旧版网站，活动日期与名称仍待核对。
      image: /uploads/legacy/screening-2021.jpg
    - year: "2026"
      title: 为下一章，整理行囊
      text: 借助飞书整理社团规范与资料档案，重新搭建公开门户，让历届创作与社团记忆继续被看见。
      image: ""
