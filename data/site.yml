name: 朝之雾动漫社
name_ja: あさのきり
tagline: 晨雾未散，同好已聚。
description: 朝之雾动漫社是由动画、漫画、游戏爱好者组成的学生社团。从周常放映、补番安利到漫展出击、舞台演出与影像创作，我们希望为每一位同好提供一片自由生长的土壤——在朝雾散去之前，和我们一起热爱这些故事。
departments:
  - name: 主席团
    text: 统筹社团的日常运营与年度活动，对接校方与兄弟社团，让每一场活动都能顺利发生。（示例文案，待主席团确认）
  - name: COS部
    text: 从服装道具制作、妆造研究到漫展出击与舞台剧演出，把喜欢的角色带到现实世界。（示例文案，待部门确认）
    image: /uploads/sample-dept-cos.svg
  - name: 动漫部落
    text: 周常放映与圆桌漫谈的主阵地，负责片单策划、新番资讯与同好交流。（示例文案，待部门确认）
  - name: 宣传部
    text: 海报、推文与视觉物料的产地，负责社团对内对外的每一次亮相。（示例文案，待部门确认）
    image: /uploads/sample-dept-pub.svg
  - name: 宅务部
    text: 物资、场地与后勤的守护者，活动现场一切井井有条的幕后功臣。（示例文案，待部门确认）
  - name: 映像研究部
    text: MAD / AMV 剪辑、宅舞与短片拍摄、活动影像记录的据点，本网站也由映研维护。（示例文案，待部门确认）
    image: /uploads/sample-dept-eizo.svg
